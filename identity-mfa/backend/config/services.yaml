parameters:
    jwt_secret: '%env(JWT_SECRET)%'
    jwt_algorithm: HS256
    jwt_refresh_expiry: 604800

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $jwtSecret: '%jwt_secret%'
            string $jwtAlgorithm: '%jwt_algorithm%'

    App\Service\WebAuthnAttestationVerifier: '@App\Service\ChallengeBindingWebAuthnVerifier'

    App\Service\RateLimiterService:
        arguments:
            $loginLimiter: '@limiter.login'
            $mfaLimiter: '@limiter.mfa'
            $apiLimiter: '@limiter.api'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Service/WebAuthnAttestationVerifier.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']


