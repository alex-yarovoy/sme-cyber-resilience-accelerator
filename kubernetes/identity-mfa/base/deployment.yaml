apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-mfa-config
data:
  APP_ENV: prod
  APP_DEBUG: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-mfa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-mfa
  template:
    metadata:
      labels:
        app: identity-mfa
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
        - name: php
          image: identity-mfa-php:latest
          envFrom:
            - configMapRef:
                name: identity-mfa-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: identity-mfa-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: identity-mfa-secrets
                  key: REDIS_URL
      volumes:
        - name: nginx-config
          configMap:
            name: identity-mfa-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: identity-mfa
spec:
  selector:
    app: identity-mfa
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-mfa-deny-east-west
spec:
  podSelector:
    matchLabels:
      app: identity-mfa
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: ingress-controller
      ports:
        - protocol: TCP
          port: 80
