services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports: ["9200:9200"]
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on: [elasticsearch]
  # One-shot: load the sme-redact ingest pipeline before Filebeat ships anything.
  pipeline-setup:
    image: curlimages/curl:8.8.0
    volumes:
      - ./configs/ingest-pipeline.json:/pipeline.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until curl -fs http://elasticsearch:9200/_cluster/health >/dev/null; do sleep 2; done;
        curl -fsS -X PUT http://elasticsearch:9200/_ingest/pipeline/sme-redact
        -H 'Content-Type: application/json' --data-binary @/pipeline.json
    depends_on: [elasticsearch]
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.2
    user: root
    volumes:
      - ./configs/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - ./configs/logs/:/var/log/app/
    depends_on:
      pipeline-setup:
        condition: service_completed_successfully
  nginx-health:
    image: nginx:alpine
    volumes:
      - ./configs/health:/usr/share/nginx/html:ro
      - ./configs/nginx-health.conf:/etc/nginx/nginx.conf:ro
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    depends_on: [nginx-health]
  prometheus:
    image: prom/prometheus:v2.53.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert-rules/:/alert-rules/
    ports: ["9090:9090"]
    depends_on: [blackbox-exporter, nginx-health]
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports: ["9093:9093"]
    depends_on: [prometheus]
